<<: !include common.yaml

sendspin_mc:
  id: sendspin_mc_implicit
  client_id: sendspin-mc-implicit
  client_name: Sendspin MC Implicit
  server_port: 8931
  control_port: 32771

media_source:
  - platform: sendspin_mc
    id: sendspin_mc_source_implicit

media_player:
  - platform: sendspin_mc
    name: Sendspin MC Implicit Controller

sensor:
  - platform: sendspin_mc
    name: Sendspin MC Implicit Duration
    type: track_duration

text_sensor:
  - platform: sendspin_mc
    name: Sendspin MC Implicit Title
    type: title

switch:
  - platform: sendspin_mc
    id: implicit_enabled
    name: Implicit Enabled

image:
  - platform: sendspin_mc
    id: implicit_art
    format: BMP
    type: RGB565
    resize: 16x16
    current_image: {id: implicit_current}
